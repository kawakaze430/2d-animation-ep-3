<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode 03 · Scene review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">BROOKS FAMILY · EPISODE 03</p><h1>Scene review<span class="dot">.</span></h1></div>
    <div class="header-meta"><span id="mode" class="badge">BLOCKING REVIEW</span><p id="totals"></p></div>
  </header>
  <main>
    <aside class="library" aria-label="Shot library">
      <div class="library-top"><h2>The story</h2><span id="filtered-count" class="muted"></span></div>
      <label class="search-label"><span class="sr-only">Search shots</span><input id="search" type="search" placeholder="Search a beat, character, or action…"></label>
      <div class="filters"><label><span>Cast</span><select id="cast-filter"><option value="">Everyone</option></select></label><label><span>Location</span><select id="location-filter"><option value="">All views</option></select></label></div>
      <nav id="shots" aria-label="Select a shot"></nav>
    </aside>
    <section class="review" aria-label="Selected shot">
      <div class="shot-heading"><div><p id="shot-number" class="eyebrow"></p><h2 id="shot-title">Loading review…</h2></div><div class="navigation"><button id="previous" aria-label="Previous shot">←</button><button id="next" aria-label="Next shot">→</button></div></div>
      <div class="stage"><img id="frame" alt="Selected scene preview"><div id="frame-error" role="status" hidden></div><div class="stage-badge" id="stage-badge">BLOCKING</div></div>
      <div class="transport"><button id="play" class="play">Play scene</button><label class="scrubber"><span class="sr-only">Scene time or sample position</span><input id="time" type="range" min="0" max="14.958333" step="0.041667" value="0"></label><output id="time-label">00.00 / 15.00s</output></div>
      <p id="notice" class="notice"></p>
      <div id="shot-cast" class="cast-chips" aria-label="Visible cast"></div>
      <div class="details-grid"><section class="detail-card"><h3>Camera & action</h3><p id="camera"></p><p id="action"></p><div id="props" class="prop-list"></div></section><section class="detail-card"><h3>Dialogue</h3><div id="dialogue"></div></section></div>
      <div class="details-grid"><section class="detail-card continuity"><h3>Opening state</h3><div id="state-in"></div></section><section class="detail-card continuity"><h3>End state</h3><div id="state-out"></div></section></div>
      <section class="detail-card reference-card"><div class="reference-title"><h3>Original character references</h3><span class="muted">Identity reference · separate from blocking</span></div><div id="references"></div></section>
    </section>
  </main>
  <script src="manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
