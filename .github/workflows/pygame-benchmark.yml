name: Episode03 full SHOT_001 Pillow vs Pygame-ce raster benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [blocking, production]
        default: blocking
        description: 'Production requires real cutout rigs and approved audio'
  pull_request:
    paths:
      - 'benchmark/pygame/**'
      - '.github/workflows/pygame-benchmark.yml'

permissions:
  contents: read

jobs:
  same-shot-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MODE: ${{ inputs.mode || 'blocking' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install same CPU renderer, FFmpeg and optional pygame-ce pinned version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r animation2d/project/requirements.txt 'pygame-ce==2.5.8'
          python - <<'PY'
          import pygame
          print('Version:',pygame.version.ver)
          assert pygame.version.ver.startswith('2.5.8')
          PY
      - name: Verify supported two-renderer contract and locked same-shot input
        run: |
          python -m py_compile benchmark/pygame/renderer.py benchmark/pygame/compare.py
          python -m unittest discover -s tests -p 'test_*.py'
          python -m benchmark.pygame.compare prepare --output build/pygame-bench --mode "$MODE"
      - name: Render 360 real Pillow Episode03 engine frames and FFmpeg MP4
        run: |
          /usr/bin/time -f 'Pillow Python 15s render runner wall: %e RSS: %M KiB' \
            python -m benchmark.pygame.compare render --backend pillow \
            --output build/pygame-bench --mode "$MODE"
      - name: Render same scene / art / camera / FPS with Pygame-ce
        run: |
          /usr/bin/time -f 'Pygame Python 15s render runner wall: %e RSS: %M KiB' \
            python -m benchmark.pygame.compare render --backend pygame \
            --output build/pygame-bench --mode "$MODE"
      - name: Pairwise QA and explicit no-migration conclusion
        run: |
          python -m benchmark.pygame.compare report --output build/pygame-bench
          cat build/pygame-bench/REPORT.md
      - name: Upload complete real A/B evidence, both MP4s, art/audio checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHOT_001-SAME-ARTWORK-Pillow-vs-Pygame-${{ github.run_id }}
          path: |
            build/pygame-bench/scene.json
            build/pygame-bench/shared_inputs.json
            build/pygame-bench/preflight.json
            build/pygame-bench/pillow_metrics.json
            build/pygame-bench/pygame_metrics.json
            build/pygame-bench/comparison.json
            build/pygame-bench/REPORT.md
            build/pygame-bench/dialogue.srt
            build/pygame-bench/*.mp4
            build/pygame-bench/*frame_*.png
          if-no-files-found: warn
          retention-days: 30
