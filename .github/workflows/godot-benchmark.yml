name: Godot vs Python fair renderer proof (synthetic artwork)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmark/godot/**'
      - '.github/workflows/godot-benchmark.yml'

permissions:
  contents: read

jobs:
  renderer-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      GODOT_VERSION: 4.7.2-stable
      GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - name: Check out main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install software-renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth mesa-utils libgl1-mesa-dri libasound2t64 libxrandr2 libxcursor1 libxi6 unzip curl
          python -m pip install -r animation2d/project/requirements.txt
      - name: Compile and regression-test Python first
        run: |
          python -m py_compile benchmark/godot/benchmark.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Create shared synthetic 15-part PNG rig and 360 poses
        run: python benchmark/godot/benchmark.py prepare --output build/godot-bench
      - name: Render 360 Python production-engine frames with test art
        run: python benchmark/godot/benchmark.py python --output build/godot-bench
      - name: Download upstream checksum-verified Godot 4.7.2
        run: |
          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          echo "$GODOT_ZIP_SHA256  /tmp/godot.zip" | sha256sum --check
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          "/tmp/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" --version
      - name: Render same art and pose with Godot Sprite2D / AnimationPlayer
        run: |
          mkdir -p build/godot-bench/godot
          /usr/bin/time -f '%e %M' -o build/godot-bench/godot_time.txt \
            xvfb-run -a -s '-screen 0 1280x800x24' \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            "/tmp/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" \
            --path benchmark/godot/godot \
            --rendering-method gl_compatibility \
            --write-movie "$PWD/build/godot-bench/godot/godot.png" \
            --fixed-fps 24 --quit-after 360 \
            -- --fixture="$PWD/build/godot-bench" \
            2>&1 | tee build/godot-bench/godot_stdout.txt
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('build/godot-bench')
          seconds,rss=(float(x) for x in (base/'godot_time.txt').read_text().split())
          with (base/'godot_metrics.json').open('w') as fd:
              json.dump({'renderer':'Godot 4.7.2 software OpenGL Sprite2D and AnimationPlayer',
                         'frame_count':360,'wall_s':seconds,'max_rss_kb':int(rss),
                         'timing_includes_xvfb_launch':True,
                         'artwork':'shared synthetic PNG parts',
                         'pose_source':'same Episode03 Python IK poses in motion.json'},fd,indent=2)
          PY
      - name: Verify PNG frames and compare renderer evidence
        run: |
          python benchmark/godot/benchmark.py report --output build/godot-bench
          cat build/godot-bench/REPORT.md
      - name: Upload report, inputs and representative rendered frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Godot-vs-Python-SYNTHETIC-${{ github.sha }}
          path: |
            build/godot-bench/manifest.json
            build/godot-bench/motion.json
            build/godot-bench/provenance.json
            build/godot-bench/art/
            build/godot-bench/python_metrics.json
            build/godot-bench/godot_metrics.json
            build/godot-bench/godot_time.txt
            build/godot-bench/godot_stdout.txt
            build/godot-bench/report.json
            build/godot-bench/REPORT.md
            build/godot-bench/comparison_contact_sheet.png
            build/godot-bench/python_frames/python00000000.png
            build/godot-bench/python_frames/python00000072.png
            build/godot-bench/python_frames/python00000180.png
            build/godot-bench/python_frames/python00000288.png
            build/godot-bench/python_frames/python00000359.png
            build/godot-bench/godot/godot00000000.png
            build/godot-bench/godot/godot00000072.png
            build/godot-bench/godot/godot00000180.png
            build/godot-bench/godot/godot00000288.png
            build/godot-bench/godot/godot00000359.png
          if-no-files-found: warn
          retention-days: 30
