name: Episode 03 reusable factory — 15-second blocking pilot (NOT production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-15s-pilot.yml']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      fingerprint: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r animation2d/project/requirements.txt
      - name: Compile real Episode03 screenplay shot with reusable action tracks
        run: |
          mkdir -p build/factory-pilot
          python -m animation2d.episode03.scene_factory \
            --scene animation2d/episode03/factory/scenes/SHOT_001.json \
            --output build/factory-pilot/scene.json
          python -m animation2d.episode03.factory_render prepare \
            --manifest build/factory-pilot/scene.json --mode blocking --size 640x360 \
            > build/factory-pilot/fingerprint.json
      - name: Export verified input signature
        id: key
        run: |
          python - <<'PY'
          import os,json
          d=json.load(open('build/factory-pilot/fingerprint.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('value='+d['fingerprint']+'\n')
          print('Compiled first 15-second scene; source checksum:',d['fingerprint'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-pilot-input
          path: |
            build/factory-pilot/scene.json
            build/factory-pilot/fingerprint.json
          if-no-files-found: error
          retention-days: 14

  chunks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r animation2d/project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: factory-pilot-input
          path: build/factory-pilot
      - uses: actions/cache@v4
        with:
          path: build/factory-pilot/chunks/chunk_${{ matrix.part }}
          key: pilot-v1-${{ needs.prepare.outputs.fingerprint }}-part-${{ matrix.part }}
      - name: Validate existing cached frames or render 60 distinct real frames
        run: |
          python -m animation2d.episode03.factory_render chunk \
            --manifest build/factory-pilot/scene.json \
            --mode blocking --size 640x360 \
            --start $((60*${{ matrix.part }})) --count 60 \
            --output build/factory-pilot/chunks/chunk_${{ matrix.part }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-frames-${{ matrix.part }}
          path: build/factory-pilot/chunks/chunk_${{ matrix.part }}/
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [prepare, chunks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install original renderer dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r animation2d/project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: factory-pilot-input
          path: build/factory-pilot
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot-frames-*
          path: build/factory-pilot/chunks
      - name: Refuse missing/corrupt frames, compose MP4, full-decode QA
        run: |
          python -m animation2d.episode03.factory_render assemble \
            --manifest build/factory-pilot/scene.json \
            --mode blocking --size 640x360 \
            --chunks build/factory-pilot/chunks \
            --output build/factory-pilot/final
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('build/factory-pilot/final/report.json')
          report=json.loads(path.read_text())
          assert report['status']=='SCHEMATIC_BLOCKING_ONLY'
          assert report['media_validation']['frames']==360
          assert report['media_validation']['full_decode']=='passed'
          print('360-frame 15s technical QA passed, creative/prod status remains BLOCKING')
          PY
      - name: Export static browser review of same JSON scene
        run: |
          python -m animation2d.episode03.preview --manifest build/factory-pilot/scene.json \
            --export build/factory-pilot/review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Episode03-SHOT_001-FACTORY-15s-SCHEMATIC-${{ github.run_id }}
          path: |
            build/factory-pilot/final/*.mp4
            build/factory-pilot/final/*.srt
            build/factory-pilot/final/report.json
            build/factory-pilot/final/contact_sheet.png
            build/factory-pilot/scene.json
            build/factory-pilot/fingerprint.json
            build/factory-pilot/review/
          if-no-files-found: warn
          retention-days: 30
